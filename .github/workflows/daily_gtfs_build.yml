name: Daily GTFS Database Build

on:
  schedule:
    - cron: '0 3 * * *' # Runs at 03:00 UTC every day
  workflow_dispatch: # Adds a button in GitHub to run it manually

permissions:
  contents: write
  
jobs:
  build-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Download and Prepare GTFS Feeds
        run: python prepare_transit_data.py

      - name: Compile SQLite Database
        run: python process_gtfs.py

      - name: Upload Database to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Transit Database
          files: app/src/main/assets/database/transit.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}